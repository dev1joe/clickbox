name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
# Scorecard's "Token-Permissions" check looks for this.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 #  match your Dockerfile's base image
          cache: npm # caches ~/.npm keyed on package-lock.json

      - run: npm ci # exact install from lockfile
      - run: npm run lint
      - run: npm run test:coverage

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    # if enabled, only run this job if lint/tests pass.
    # but will disable it so both jobs run in parallel.
    # needs: lint-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.4: lint the Dockerfile
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error # only errors fail the job; warnings still get printed

      # 3.4: build the image
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true # makes the image available to `docker run` below
          tags: brix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3.5: run it and check /version
      - name: Run container
        run: docker run -d --name brix -p 3000:3000 brix:ci

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' brix)"
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "Container never became healthy"
          exit 1

      - name: Check /api/version
        run: |
          expected="$(jq -r .version package.json)"
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors http://localhost:3000/api/version)"
          echo "response=$response"
          actual="$(echo "$response" | jq -r .version)"
          echo "expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "Error: Version mismatch! expected '$expected', got '$actual'."
            exit 1
          fi

      - name: Debug container
        if: always()
        run: |
          docker ps -a
          echo "--- logs ---"
          docker logs brix
          echo "--- probe ---"
          curl -v http://localhost:3000/api/version || true
