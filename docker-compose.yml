  valkey:
    image: valkey/valkey:9.1.3-alpine3.24
    ports:
      - 6379:6379
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    volumes:
      - rustfs-data:/data
    networks:
      - my-network

volumes:
  rustfs-data:
    name: brix-rustfs-data

networks:
  my-network:
    name: brix-network
