sonar.projectKey=dev1joe_brix
sonar.organization=dev1joe

sonar.exclusions=**/*.smoke.test.ts
sonar.coverage.exclusions=**/*.smoke.test.ts

# IMPORTANT
# telling sonar where the coverage report is
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sources=src
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**
sonar.coverage.exclusions=src/tests/**

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=brix
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
